# Release identity. Database and portable-data versions have independent compatibility rules.
#
# Version code: app/build.gradle.kts computes it from version.name and version.build; it is never written here.
#   version code = major x 1,000,000 + minor x 10,000 + patch x 100 + build
#   0.0.18 build 1 -> 1801, 0.0.18 build 2 -> 1802, 0.0.19 build 1 -> 1901, 0.1.0 build 1 -> 10001,
#   1.0.0 build 1 -> 1000001
# Rules:
#   - version.name is major.minor.patch. Minor and patch are 0-99; major is 0-2099.
#   - version.build counts uploads of one version.name, 1-99: add 1 for each new upload of the same version and set
#     it back to 1 with a new version.name. Play accepts an upload only with a larger code than every earlier one.
#   - A value outside these ranges fails the build rather than giving a wrong code.
#   - Backups record the code, and the app refuses a backup made by a larger one, so a release is the last build
#     tested, never an earlier one.
#
# Internal build: taken from the commit date at build time (see app/build.gradle.kts); build.id is only the fallback
# when git history is unavailable.
version.name=0.0.18
version.build=2
build.id=20261108.1
